name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | LC_ALL=C sort | head -n 1)
          echo "Using $ZIP"
          rm -rf src && mkdir src && unzip -q "$ZIP" -d src
          DIR=$(dirname "$(find src -name settings.gradle.kts | head -n 1)")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Load the signing key from secrets
        env:
          RF_KEYSTORE_B64: ${{ secrets.RF_KEYSTORE_B64 }}
          RF_PASSWORD: ${{ secrets.RF_PASSWORD }}
        run: |
          # Clean up anything extra that got pasted in (spaces, line breaks, hidden characters)
          KEY=$(printf '%s' "$RF_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=')
          PW=$(printf '%s' "$RF_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          echo "Key length after clean-up: ${#KEY} (should be 2860)"
          if [ -n "$KEY" ] && [ -n "$PW" ] && printf '%s' "$KEY" | base64 -d > "$RUNNER_TEMP/readfirst.keystore" 2>/dev/null \
             && keytool -list -keystore "$RUNNER_TEMP/readfirst.keystore" -storepass "$PW" -alias readfirst >/dev/null 2>&1; then
            echo "Signing key OK"
            echo "RF_KEYSTORE=$RUNNER_TEMP/readfirst.keystore" >> "$GITHUB_ENV"
            echo "::add-mask::$PW"
            echo "RF_PASSWORD=$PW" >> "$GITHUB_ENV"
          else
            echo "::warning::The signing key in the secrets could not be read, so this build uses a standard test key instead. The app still works."
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build app
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Name the file
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" ReadFirst.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReadFirst-apk
          path: ReadFirst.apk

      - name: Update the download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app ReadFirst.apk --title "Read First" --notes "Tap ReadFirst.apk to download and install." --latest
